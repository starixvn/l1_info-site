include:
  - project: "ci/core-cicd"
    ref: main
    file: "luminet.gitlab-ci.yml"

.base_transform_config:
  stage: transform-config
  script:
    - echo "====== Build NextJS ======"
    - echo $DEPLOY_ENV
    - echo $CONFIG_FILE_PATH
    - echo $CONFIG_FILE_NAME
    - echo $CONFIG_FILE_EXTENSION
    - cp $CONFIG_FILE_PATH/$CONFIG_FILE_NAME.$DEPLOY_ENV.$CONFIG_FILE_EXTENSION ./$CONFIG_FILE_NAME.$CONFIG_FILE_EXTENSION
  tags:
    - docker
  artifacts:
    paths:
      - ././$CONFIG_FILE_NAME.$CONFIG_FILE_EXTENSION
    expire_in: 1 day
